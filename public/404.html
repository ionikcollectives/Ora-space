<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2B1C">
<title>Page not found · ORA Space</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse 70% 55% at 50% 38%, #17432d, #081a11 72%);
    color: #f4eedd; text-align: center;
    font-family: "Cormorant Garamond", Garamond, "Iowan Old Style", "Times New Roman", serif;
  }
  main { display: grid; justify-items: center; gap: 18px; max-width: 30rem; }
  img { width: 112px; height: 112px; }
  p.code { margin: 0; font-family: "Cinzel", "Trajan Pro", Optima, Georgia, serif; font-size: .78rem; letter-spacing: .32em; text-transform: uppercase; color: #cfa95b; }
  h1 { margin: 0; font-weight: 300; font-size: clamp(2rem, 1.4rem + 3vw, 3.2rem); line-height: 1.1; }
  h1 em { color: #e6cf94; }
  p { margin: 0; font-size: 1.15rem; line-height: 1.55; color: rgba(244, 238, 221, .8); }
  a {
    margin-top: 8px; display: inline-block; padding: 14px 26px; border-radius: 999px; text-decoration: none;
    font-family: "Cinzel", "Trajan Pro", Optima, Georgia, serif; font-size: .78rem; letter-spacing: .2em; text-transform: uppercase;
    color: #0e2b1c; background: linear-gradient(135deg, #e6cf94, #cfa95b 55%, #b48b42);
  }
  a:focus-visible { outline: 2px solid #e6cf94; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" width="112" height="112">
  <p class="code">Page not found</p>
  <h1>This path wanders <em>off the walk.</em></h1>
  <p>The page you were looking for isn’t here. The arches, the garden and the lanterns are all back at the start.</p>
  <a href="/">Back to the arch</a>
</main>
</body>
</html>
